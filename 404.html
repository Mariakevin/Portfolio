<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f3eee4">
  <title>Page not found — Maria Kevin</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .notfound {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 0;
    }
    .notfound-card {
      width: min(100% - 40px, 720px);
      border: 1px solid var(--border);
      background: var(--surface);
      padding: clamp(28px, 5vw, 56px);
      box-shadow: var(--shadow-subtle);
    }
    .notfound-code {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .notfound-title {
      margin: 18px 0 14px;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(2.8rem, 8vw, 5.2rem);
      line-height: 0.94;
      letter-spacing: -0.02em;
    }
    .notfound-text {
      margin: 0 0 28px;
      max-width: 46ch;
      color: var(--text-2);
      line-height: 1.6;
    }
    .notfound-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }
    .notfound-meta {
      margin-top: 34px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
    }
  </style>
</head>
<body>
  <main class="notfound">
    <div class="notfound-card">
      <p class="notfound-code">Error 404 — Index / Dossier</p>
      <h1 class="notfound-title">This page is not in the dossier.</h1>
      <p class="notfound-text">
        The address may have moved, or the link may be incomplete. The documented work, research notes, and contact details are all on the main index.
      </p>
      <div class="notfound-actions">
        <a class="btn btn-primary" href="./">Back to the index</a>
        <a class="btn btn-secondary" href="./#projects">Browse case studies</a>
      </div>
      <p class="notfound-meta">Maria Kevin · Software developer · Chennai, India</p>
    </div>
  </main>
</body>
</html>
